<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>קליפX - עורך וידאו</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Heebo:wght@400;500;700&display=swap">
<style>
:root{--ui:Rubik,Heebo,'Segoe UI',system-ui,sans-serif;--bg:#f1f2f7;--card:#fff;--line:#e6e8f0;--ink:#1b1b2f;--mut:#7b8099;--pri:#2563eb;--pri2:#5b9dff;--soft:#eaf3ff;--sh:0 4px 20px rgba(30,50,100,.07)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--ui);font-weight:500;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
button{font-family:inherit}
.card{background:var(--card);border-radius:18px;border:1px solid var(--line);box-shadow:var(--sh)}
#app{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:84px 300px minmax(0,1fr) 84px;gap:12px;padding:12px;position:relative}
.rail{display:flex;flex-direction:column;gap:14px;padding:10px 0;overflow-y:auto}
.rb{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;font-size:12px;font-weight:500;color:var(--ink);border-radius:12px;margin:0 6px}
.rb:hover{background:rgba(255,255,255,.75)}.rb.on{background:var(--soft);color:var(--pri)}
.logo{width:40px;height:40px;border-radius:12px;margin:6px auto 14px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center}
#side{display:flex;flex-direction:column;padding:16px;gap:12px;min-height:0}
#sidehead{font-weight:700;font-size:16px}
#sbody{overflow-y:auto;overflow-x:hidden;min-width:0;display:flex;flex-direction:column;gap:12px;flex:1;padding-left:2px}
.ttl2{font-weight:700;font-size:13px;margin-top:4px}
.hint{color:var(--mut);font-size:13px;line-height:1.7;margin:0;text-align:center;border:2px dashed var(--line);border-radius:14px;padding:20px 12px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:6px}
.btn{font:500 14px var(--ui);border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;height:40px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:.15s}
.btn:hover{border-color:#bcd3fb}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;box-shadow:0 8px 20px rgba(37,99,235,.28)}
.btn.wide{width:100%;justify-content:center}
.ibtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.ibtn:hover{background:#f2f7ff}.ibtn:disabled{opacity:.35;pointer-events:none}
.ibtn.sm{width:28px;height:28px;border:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.asset{cursor:pointer;display:flex;flex-direction:column;gap:5px;font-size:12px;min-width:0}
.asset .th{aspect-ratio:16/10;border-radius:10px;background:#eef0f7 center/cover no-repeat;position:relative;display:grid;place-items:center;color:var(--mut);border:2px solid transparent}
.asset:hover .th{border-color:var(--pri)}
.asset small{position:absolute;bottom:4px;left:4px;background:rgba(27,27,47,.75);color:#fff;border-radius:5px;padding:0 5px;font-size:10px}
.asset b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 4px;font-size:12px;font-weight:500;cursor:pointer;color:var(--ink)}
.tile:hover{border-color:#bcd3fb}.tile.on{border-color:var(--pri);background:var(--soft);color:var(--pri)}
.pre{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;text-align:right;color:var(--ink)}
.pre:hover{border-color:var(--pri)}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1;min-height:220px;overflow:auto;align-content:start}
.fb{min-width:0;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;color:var(--ink)}
.fb span{font-size:20px;line-height:1.3;white-space:nowrap}.fb small{font:400 10px var(--ui);color:var(--mut);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb.on{border-color:var(--pri);background:var(--soft)}
.inp{font:400 14px var(--ui);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:0;color:var(--ink);background:#fafbff;width:100%;resize:none}
.inp:focus{border-color:var(--pri);background:#fff}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--pri)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font:500 13px var(--ui);color:var(--mut);cursor:pointer}
.chip.on{background:var(--soft);color:var(--pri);border-color:#b3cdfa}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:#e3e6f2;outline:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--pri);border:2px solid #fff;box-shadow:0 2px 6px rgba(30,60,140,.4)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--pri);border:2px solid #fff}
#stage{display:flex;flex-direction:column;padding:12px;gap:10px;min-height:0}
.top{display:flex;align-items:center;gap:8px}
.sp{flex:1}
#center{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
#stage{flex:1}
.gh{grid-column:1/-1;font-size:11px;font-weight:700;color:var(--mut);margin-top:4px}
.cv{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafafd;border-radius:12px}
canvas{flex:none;border-radius:4px;background:#000;box-shadow:0 8px 28px rgba(30,50,100,.18)}
#selbox{position:absolute;border:2px solid var(--pri);cursor:move;touch-action:none;z-index:3}
#selbox[hidden]{display:none}
.hd{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--pri);cursor:nwse-resize}
.hd.a{left:-7px;top:-7px}.hd.b{right:-7px;top:-7px}.hd.c{left:-7px;bottom:-7px}.hd.d{right:-7px;bottom:-7px}
#fs{position:absolute;bottom:10px;left:10px;z-index:4}
#pop{position:absolute;left:108px;top:24px;width:250px;padding:14px;z-index:20;display:flex;flex-direction:column;gap:12px}
#pop[hidden]{display:none}
.phd{display:flex;align-items:center;justify-content:space-between}
#tl{flex:none;margin:0;overflow:hidden;display:flex;flex-direction:column;max-height:50vh}
.tbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px;direction:ltr}
.tg{display:flex;gap:6px}.tg.r{justify-content:flex-end}
.tp{display:flex;align-items:center;gap:10px}
.pbtn{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;border:0;cursor:pointer;display:grid;place-items:center}
#time{font-weight:700;font-size:13px;min-width:130px;text-align:center}
#scroll{overflow:auto;direction:ltr;padding-bottom:8px;min-height:0}
#inner{position:relative;min-width:100%}
.lane{position:relative;margin-left:14px;flex:none}
.ruler{height:28px;background:var(--soft);border-radius:8px;cursor:pointer}
.ruler b{position:absolute;top:7px;transform:translateX(-50%);font-size:11px;font-weight:500;color:var(--mut)}
.ruler u{position:absolute;top:12px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#bcd0f2}
.ln{margin-top:6px}
.ph{position:absolute;inset:0;border:1.5px dashed #d5d9e8;border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--mut);font-size:13px;cursor:pointer;direction:ltr}
.ph:hover{border-color:var(--pri);color:var(--pri)}
.ph.a{background-image:repeating-linear-gradient(90deg,#dbe8fd 0 2px,transparent 2px 7px);background-size:100% 40%;background-repeat:no-repeat;background-position:center}
.clip{position:absolute;border-radius:10px;border:2px solid transparent;overflow:hidden;cursor:grab;user-select:none;touch-action:none;background-size:auto 100%;background-repeat:repeat-x}
.clip.video{background-color:#e1ecfd;border-color:#bcd3fb}
.clip.image{background-color:#d6f3e8;border-color:#a8e0cb}
.clip.text{background-color:#ffeaa7;border-color:#f1c84b}
.clip.audio{background-color:#ffe3d0;border-color:#f5bd97;background-image:repeating-linear-gradient(90deg,#f5a26d66 0 2px,transparent 2px 6px)}
.clip.sel{border-color:var(--pri);box-shadow:0 0 0 2px rgba(37,99,235,.25);z-index:3}
.clip span{position:relative;display:inline-block;margin:4px 14px;font-size:11px;background:rgba(255,255,255,.9);padding:1px 7px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 28px);pointer-events:none;unicode-bidi:plaintext}
.h{position:absolute;top:0;bottom:0;width:12px;cursor:ew-resize;display:none;align-items:center;justify-content:center}
.h::after{content:'';width:3px;height:16px;border-radius:2px;background:#fff}
.clip.sel .h{display:flex;background:var(--pri)}
.h.l{left:0}.h.r{right:0}
#phd{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);z-index:5;pointer-events:none}
#phd::before{content:'';position:absolute;top:6px;left:-6px;width:14px;height:14px;border-radius:50%;background:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(27,27,47,.35);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50}
.modal[hidden]{display:none}
.box{width:min(480px,92vw);padding:24px;display:flex;flex-direction:column;gap:16px}
.box h3{margin:0;font-size:18px}
.box .lbl{font-size:12px;color:var(--mut);margin-bottom:8px}
.note{font-size:12px;color:var(--mut);line-height:1.6}
.prog{height:10px;background:#e6e9f7;border-radius:10px;overflow:hidden}
#pbar{height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2))}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
#toast.on{opacity:1;transform:translateX(-50%)}
body.drop #stage{outline:3px dashed var(--pri);outline-offset:-8px}
@media(max-height:700px){#app{padding:8px;gap:8px;grid-template-columns:64px 250px minmax(0,1fr) 64px}.rb{font-size:11px;gap:5px;padding:8px 0}.rail{gap:8px}.logo{width:34px;height:34px;margin:2px auto 6px}.ibtn{width:32px;height:32px}.pbtn{width:38px;height:38px}.tbar{padding:6px 12px}#side{padding:12px}}
@media(max-width:1000px){#app{grid-template-columns:70px 240px minmax(0,1fr) 70px}}
button,input,textarea,select{font-family:var(--ui)}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
#scroll{scrollbar-width:auto}
#scroll::-webkit-scrollbar{display:block;height:6px;width:6px}
#scroll::-webkit-scrollbar:vertical{display:none}
#scroll::-webkit-scrollbar-track{background:transparent}
#scroll::-webkit-scrollbar-thumb{background:#c3d6f8;border-radius:6px}
#scroll::-webkit-scrollbar-thumb:hover{background:var(--pri2)}
@supports not selector(::-webkit-scrollbar){#scroll{scrollbar-width:thin;scrollbar-color:#c3d6f8 transparent}}
.rm{margin-left:auto;display:grid;place-items:center;width:22px;height:22px;border-radius:7px}.rm:hover{background:var(--soft)}.rm svg{width:13px;height:13px}
#lmenu{position:fixed;z-index:30;width:178px;padding:6px;display:flex;flex-direction:column;gap:2px}#lmenu[hidden]{display:none}
#lmenu button{border:0;background:none;padding:9px 12px;border-radius:9px;text-align:right;cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}#lmenu button:hover{background:var(--soft)}
#ed{position:absolute;z-index:6;resize:none;overflow:hidden;white-space:pre;text-align:center;line-height:1.25;background:rgba(15,15,30,.45);border:2px dashed var(--pri);border-radius:8px;outline:0;padding:6px 8px;text-shadow:0 1px 6px rgba(0,0,0,.4)}#ed[hidden]{display:none}
#edtb{position:absolute;z-index:7;display:flex;gap:6px;padding:6px;white-space:nowrap}#edtb[hidden]{display:none}#edtb .btn{height:32px;font-size:12.5px;padding:0 10px}#edtb svg{width:16px;height:16px}
#mq{position:fixed;display:none;border:1.5px solid var(--pri);background:rgba(37,99,235,.12);border-radius:4px;z-index:40;pointer-events:none}
.bulk{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--soft)}
.brow{display:flex;gap:6px;flex-wrap:wrap}.brow .btn{height:34px;padding:0 12px;font-size:13px}.brow .inp{flex:1;min-width:90px}
.chip svg{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-left:4px}
.lane.ruler{position:sticky;top:0;z-index:4}
#scroll{overflow-anchor:none}
#hm{position:fixed;inset:0;background:var(--bg);z-index:45;overflow-y:auto;display:flex;justify-content:center;padding:48px 24px}#hm[hidden]{display:none}
.hbox{width:min(1000px,100%);display:flex;flex-direction:column;gap:28px}
.hhead{display:flex;align-items:center;justify-content:space-between}.hhead h1{margin:0;font-size:28px;font-weight:700}
#hlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.pc{cursor:pointer;overflow:hidden;display:flex;flex-direction:column;transition:.15s}.pc:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(30,60,140,.14)}
.pc .pt{aspect-ratio:16/9;background:#eceefa center/cover no-repeat;display:grid;place-items:center;color:var(--mut)}.pc .pt svg{width:34px;height:34px}
.pc .pi{padding:12px 14px;display:flex;flex-direction:column;gap:3px}.pc .pn{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc .pm{font-size:12px;color:var(--mut)}
.pc .pa{display:flex;gap:6px;padding:0 10px 10px;justify-content:flex-start}.pc .pa .ibtn{width:32px;height:32px}
.logo{cursor:default}
</style>
</head>
<body>
<div id="app">
  <nav class="rail">
    <div class="logo" data-ic="film"></div>
    <button class="rb" id="gohome" title="מסך הבית"><span data-ic="home"></span>הפרויקטים</button>
    <button class="rb" data-tab="media" title="המדיה שלי"><span data-ic="folder"></span>המדיה שלי</button>
    <button class="rb" data-tab="text" title="טקסט"><span data-ic="text"></span>טקסט</button>
    <button class="rb" data-tab="trans" title="מעברים"><span data-ic="trans"></span>מעברים</button>
    <button class="rb" data-tab="anim" title="הנפשות"><span data-ic="anim"></span>הנפשות</button>
  </nav>
  <aside id="side" class="card"><div id="sidehead"></div><div id="sbody"></div></aside>
  <div id="center">
  <section id="stage" class="card">
    <div class="top">
      <button class="ibtn" id="redo" title="קדימה"><span data-ic="redo"></span></button>
      <button class="ibtn" id="undo" title="ביטול פעולה"><span data-ic="undo"></span></button>
      <div class="sp"></div><div class="chips" id="asp"></div><div class="sp"></div>
      <button class="btn pri" id="exp"><span data-ic="up"></span>ייצוא</button>
    </div>
    <div class="cv" id="cvbox">
      <canvas id="cv"></canvas>
      <div id="selbox" hidden><i class="hd a"></i><i class="hd b"></i><i class="hd c"></i><i class="hd d"></i></div>
      <button class="ibtn" id="fs" title="מסך מלא"><span data-ic="fs"></span></button>
      <textarea id="ed" hidden wrap="off" dir="auto" spellcheck="false"></textarea>
      <div id="edtb" class="card" hidden><button class="btn" id="edfix" title="הופך טקסט שהוקלד במקלדת אנגלית לעברית">תיקון ג׳יבריש</button><button class="btn" id="edai" title="שכתוב אוטומטי של הטקסט"><span data-ic="anim"></span>שכתוב</button><button class="btn" id="edkey" title="מפתח Gemini / Anthropic">מפתח API</button><button class="btn pri" id="eddone">סיום</button></div>
    </div>
  </section>
  <section id="tl" class="card">
  <div class="tbar">
    <div class="tg">
      <button class="ibtn" id="zo" title="הקטנה"><span data-ic="minus"></span></button>
      <button class="ibtn" id="zi" title="הגדלה"><span data-ic="plus"></span></button>
      <button class="ibtn" id="zf" title="התאמה לחלון"><span data-ic="fit"></span></button>
    </div>
    <div class="tp">
      <button class="ibtn" id="home" title="להתחלה"><span data-ic="start"></span></button>
      <button class="ibtn" id="b5" title="חמש שניות אחורה"><span data-ic="back"></span></button>
      <button class="pbtn" id="play"></button>
      <button class="ibtn" id="f5" title="חמש שניות קדימה"><span data-ic="fwd"></span></button>
      <div id="time">0:00.00 / 0:00.00</div>
    </div>
    <div class="tg r">
      <button class="ibtn" id="trs" title="תמלול אוטומטי לכתוביות (וידאו / שמע נבחר)"><span data-ic="cc"></span></button>
      <button class="ibtn" id="addl" title="הוספת ערוץ"><span data-ic="layers"></span></button>
      <button class="ibtn" id="split" title="פיצול (S)"><span data-ic="cut"></span></button>
      <button class="ibtn" id="del" title="מחיקה"><span data-ic="trash"></span></button>
    </div>
  </div>
  <div id="scroll"><div id="inner"></div></div>
</section>
  </div>
  <nav class="rail">
    <button class="rb" data-tool="opa" title="עמעום"><span data-ic="opa"></span>עמעום</button>
    <button class="rb" data-tool="flt" title="מסננים"><span data-ic="flt"></span>מסננים</button>
    <button class="rb" data-tool="fx" title="אפקטים"><span data-ic="fx"></span>אפקטים</button>
    <button class="rb" data-tool="col" title="כוונון צבע"><span data-ic="col"></span>כוונון צבע</button>
    <button class="rb" data-tool="vol" title="עוצמה"><span data-ic="vol"></span>עוצמה</button>
  </nav>
  <div id="pop" class="card" hidden></div>
</div>

<input type="file" id="file" multiple hidden>
<div class="modal" id="modal" hidden>
  <div class="box card">
    <div id="mbody" style="display:flex;flex-direction:column;gap:16px">
      <h3>ייצוא פרויקט</h3>
      <div><div class="lbl">פורמט</div><div class="chips" id="fmts"></div></div>

</div>

<div id="mq"></div>
<div id="lmenu" class="card" hidden><button data-al="t">ערוץ טקסט</button><button data-al="v">ערוץ שכבת על</button><button data-al="a">ערוץ מוזיקה / שמע</button></div>

<script>
const $=s=>document.querySelector(s);

  m.onloadedmetadata=()=>{a.dur=isFinite(m.duration)?m.duration:1;if(a.kind==='audio')return res();m.currentTime=Math.min(.3,a.dur/3)};
  m.onseeked=()=>{const c=document.createElement('canvas');c.width=160;c.height=90;const r=Math.max(160/m.videoWidth,90/m.videoHeight);

    :'<p class="hint" style="grid-column:1/-1">אין פרויקטים עדיין. לחצו על "פרויקט חדש" כדי להתחיל.</p>'}
$('#hlist').addEventListener('click',async e=>{const b=e.target.closest('button'),c=e.target.closest('.pc');if(!c)return;
  if(b&&b.dataset.del){const id=b.dataset.del,rec=await dbGet('projects',id);if(!confirm('למחוק את הפרויקט "'+(rec?rec.name:'')+'"? אי אפשר לשחזר.'))return;
    await tx('projects','readwrite',o=>o.delete(id));await tx('blobs','readwrite',o=>o.delete(IDBKeyRange.bound([id,0],[id,Infinity])));renderHome()}
  else if(b&&b.dataset.ren){const id=b.dataset.ren,rec=await dbGet('projects',id),n=prompt('שם הפרויקט:',rec.name);if(n&&n.trim()){rec.name=n.trim();await dbPut('projects',rec);renderHome()}}
  else if(!b)openProject(c.dataset.open)});
$('#hnew').onclick=newProject;$('#gohome').onclick=goHome;
document.querySelectorAll('#hm [data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic));
S.lanes=defLanes();setSize();renderSide();renderPop();renderTL();requestAnimationFrame(tick);
(async()=>{try{const all=await dbAll('projects');if(!all.length)await newProject();else renderHome()}catch(e){renderHome()}})();
</script>
<script src="https://xnet2.github.io/status/xnet-badge.js"></script>
